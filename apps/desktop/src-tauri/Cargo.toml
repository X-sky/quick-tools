[package]
name = "quick-tools-desktop"
version = "0.1.0"
edition = "2021"
description = "Quick Tools Desktop Application"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "quick_tools_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]
