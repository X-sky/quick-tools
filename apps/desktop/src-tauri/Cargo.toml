[package]
name = "quick-tools-desktop"
version = "0.1.0"
edition = "2021"
description = "Quick Tools Desktop Application"

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "quick_tools_desktop_lib"
# Desktop-only app: main.rs links the lib as an rlib. The cdylib/staticlib
# outputs only exist for the mobile targets the Tauri template assumes.
crate-type = ["rlib"]
